<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerador de Duplas V2</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--primary:#1565c0;--line:#dbe3ee;--ok:#16794b;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:820px;margin:auto;padding:14px 14px 90px}h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5}.tab,.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:10px 12px;font-size:15px}.tab.active,.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--danger)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar .btn{flex:1;min-width:120px}.player{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center}.player small{display:block;color:var(--muted);margin-top:3px}.edit{border:0;background:transparent;font-size:20px;min-width:44px;min-height:44px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef4fb;font-size:12px;margin-right:5px}.section-title{font-weight:700;margin:18px 2px 8px}.pair{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:7px}.pair select{width:100%}.x{text-align:center;color:var(--muted)}input,select{font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--text)}label{display:block;font-size:13px;color:var(--muted);margin:9px 0 4px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:820px;margin:auto;border-radius:18px 18px 0 0;padding:18px;max-height:88%;overflow:auto}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:15px}.actions .btn{flex:1}.empty{text-align:center;color:var(--muted);padding:24px 8px}.note{font-size:12px;color:var(--muted)}@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:18px;max-width:520px}.players-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.players-grid .card{margin:0}}
@media print{body{background:#fff}.tabs,.no-print,#cadastro,#sorteio,.sub{display:none!important}.app{max-width:none;padding:0}#resultado{display:block!important}.card{break-inside:avoid;border-color:#aaa}h1{font-size:20px}}
</style>
</head><body><div class="app">
<h1>⚽ Gerador de Duplas V2</h1><div class="sub">Cadastro salvo neste aparelho • sorteio por posição • edição manual • WhatsApp/PDF</div>
<div class="tabs no-print"><button class="tab active" data-tab="cadastro">Jogadores</button><button class="tab" data-tab="sorteio">Sorteio</button><button class="tab" data-tab="resultado">Resultado</button></div>
<section id="cadastro" class="panel active"><div class="toolbar"><button id="novo" class="btn primary">+ Novo atleta</button><button id="reset" class="btn danger">Restaurar lista inicial</button></div><div id="players" class="players-grid"></div></section>
<section id="sorteio" class="panel"><div class="toolbar"><button id="todos" class="btn">Marcar todos</button><button id="nenhum" class="btn">Desmarcar todos</button><button id="gerar" class="btn primary">Gerar duplas</button></div><div class="note">As duplas são formadas somente entre atletas da mesma posição. As estrelas ajudam a equilibrar os pares. Sua seleção também fica salva neste aparelho.</div><div id="selection" class="players-grid" style="margin-top:10px"></div></section>
<section id="resultado" class="panel"><div class="toolbar no-print"><button id="novamente" class="btn primary">Sortear novamente</button><button id="copiar" class="btn">Copiar WhatsApp</button><button id="pdf" class="btn">Exportar PDF</button></div><div id="result"></div></section>
</div>
<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">Atleta</h3><label>Nome</label><input id="nome" style="width:100%"><div class="row2"><div><label>Posição</label><select id="pos" style="width:100%"><option>Goleiro</option><option>Defesa</option><option>Meio</option><option>Ataque</option></select></div><div><label>Nível</label><select id="nivel" style="width:100%"><option value="1">⭐ 1</option><option value="2">⭐⭐ 2</option><option value="3">⭐⭐⭐ 3</option><option value="4">⭐⭐⭐⭐ 4</option><option value="5">⭐⭐⭐⭐⭐ 5</option></select></div></div><div class="actions"><button id="excluir" class="btn danger">Excluir</button><button id="cancelar" class="btn">Cancelar</button><button id="salvar" class="btn primary">Salvar</button></div></div></div>
<script>
(function(){'use strict';
var KEY='gerador_duplas_v2_atletas', SEL='gerador_duplas_v2_selecao';
var seed=[
['Leydson','Meio',4],['Julio','Defesa',4],['Ruviery Diego','Ataque',4],['Thiaguinho','Meio',3],['Edson Oliveira','Defesa',3],['Daniel','Ataque',3],['Eudes Demetrio','Defesa',3],['Paulo','Meio',3],['Gabriel JVT','Ataque',4],['Arthur Martins','Defesa',3],['Arioston Ramalho','Meio',3],['Luis Vaqueiro Novo','Ataque',3],['Henrique Moura','Defesa',4],['Jheymisson','Meio',3],['Gabriel','Ataque',3],['Everton Soteldo','Ataque',4],['Ricardo Dutra','Defesa',3],['Japa Racha','Meio',3],['Pablo','Ataque',3],['Jocienio','Defesa',3],['Bruno Personal','Meio',3],['Guga Moura','Ataque',3],['Nilson Cunha','Defesa',3],['Jefferson Nego','Meio',3],['Samuel Curota','Ataque',3],['Matheus Racha','Defesa',3],['Rodolfo Almeida','Meio',3],['Duarte','Ataque',3],['Bruno Viana','Defesa',3],['Toninho','Goleiro',3]
].map(function(x,i){return{id:'p'+(i+1),nome:x[0],pos:x[1],nivel:x[2]}});
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:seed.slice()}catch(e){return seed.slice()}}
var atletas=load(), pares=[], editId=null;function save(){localStorage.setItem(KEY,JSON.stringify(atletas))}function selectedMap(){try{return JSON.parse(localStorage.getItem(SEL))||{}}catch(e){return{}}}var sel=selectedMap();function saveSel(){localStorage.setItem(SEL,JSON.stringify(sel))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function stars(n){return'⭐'.repeat(Number(n)||0)}
function renderPlayers(){var el=document.getElementById('players');el.innerHTML=atletas.map(function(a){return'<div class="card player"><div>👤</div><div><b>'+esc(a.nome)+'</b><small><span class="badge">'+esc(a.pos)+'</span>'+stars(a.nivel)+'</small></div><button class="edit" data-edit="'+a.id+'">✏️</button></div>'}).join('')||'<div class="empty">Nenhum atleta cadastrado.</div>';bindEdit(el)}
function renderSelection(){var el=document.getElementById('selection');el.innerHTML=atletas.map(function(a){var checked=sel[a.id]!==false?'checked':'';return'<label class="card player" style="cursor:pointer"><input type="checkbox" data-sel="'+a.id+'" '+checked+'><div><b>'+esc(a.nome)+'</b><small><span class="badge">'+esc(a.pos)+'</span>'+stars(a.nivel)+'</small></div><button type="button" class="edit" data-edit="'+a.id+'">✏️</button></label>'}).join('');Array.prototype.forEach.call(el.querySelectorAll('[data-sel]'),function(c){c.addEventListener('change',function(){sel[c.dataset.sel]=c.checked;saveSel()})});bindEdit(el)}
function bindEdit(root){Array.prototype.forEach.call(root.querySelectorAll('[data-edit]'),function(b){b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openEdit(b.dataset.edit)})})}
function openEdit(id){editId=id;var a=atletas.find(function(x){return x.id===id});document.getElementById('modalTitle').textContent=a?'Editar atleta':'Novo atleta';document.getElementById('nome').value=a?a.nome:'';document.getElementById('pos').value=a?a.pos:'Defesa';document.getElementById('nivel').value=a?String(a.nivel):'3';document.getElementById('excluir').style.display=a?'block':'none';document.getElementById('modal').classList.add('show')}
function close(){document.getElementById('modal').classList.remove('show')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function makePairs(){var chosen=atletas.filter(function(a){return sel[a.id]!==false}), groups={}, out=[];['Goleiro','Defesa','Meio','Ataque'].forEach(function(p){groups[p]=[]});chosen.forEach(function(a){(groups[a.pos]||(groups[a.pos]=[])).push(a)});Object.keys(groups).forEach(function(pos){var g=shuffle(groups[pos]).sort(function(a,b){return b.nivel-a.nivel+(Math.random()-.5)});while(g.length>1){var a=g.shift(), best=0, bd=99;for(var i=0;i<g.length;i++){var d=Math.abs(a.nivel-g[i].nivel)+Math.random()*.6;if(d<bd){bd=d;best=i}}out.push({pos:pos,a:a,b:g.splice(best,1)[0]})}if(g.length)out.push({pos:pos,a:g[0],b:null})});pares=out;renderResult();showTab('resultado')}
function options(pos,current){return atletas.filter(function(a){return a.pos===pos}).map(function(a){return'<option value="'+a.id+'" '+(current&&a.id===current.id?'selected':'')+'>'+esc(a.nome)+' ('+a.nivel+'⭐)</option>'}).join('')}
function renderResult(){var el=document.getElementById('result');if(!pares.length){el.innerHTML='<div class="empty">Ainda não há sorteio.</div>';return}var html='', last='';pares.forEach(function(p,i){if(p.pos!==last){html+='<div class="section-title">'+esc(p.pos)+'</div>';last=p.pos}html+='<div class="card pair"><select data-pair="'+i+'" data-side="a">'+options(p.pos,p.a)+'</select><div class="x">×</div>'+(p.b?'<select data-pair="'+i+'" data-side="b">'+options(p.pos,p.b)+'</select>':'<div><b>Sem dupla</b><div class="note">Quantidade ímpar</div></div>')+'</div>'});el.innerHTML=html;Array.prototype.forEach.call(el.querySelectorAll('select[data-pair]'),function(s){s.addEventListener('change',function(){var idx=+s.dataset.pair, side=s.dataset.side, other=side==='a'?'b':'a', old=pares[idx][side], neo=atletas.find(function(a){return a.id===s.value});var swap=null,swapSide=null;pares.forEach(function(p,j){['a','b'].forEach(function(k){if(j!==idx&&p[k]&&p[k].id===neo.id){swap=j;swapSide=k}})});if(swap!==null){pares[swap][swapSide]=old}pares[idx][side]=neo;renderResult()})})}
function textResult(){var d=new Date(), txt='⚽ *DUPLAS DO MÊS*\n📅 '+d.toLocaleDateString('pt-BR')+'\n';var last='';pares.forEach(function(p){if(p.pos!==last){txt+='\n*'+p.pos.toUpperCase()+'*\n';last=p.pos}txt+='• '+p.a.nome+(p.b?' + '+p.b.nome:' — sem dupla')+'\n'});return txt}
function showTab(id){Array.prototype.forEach.call(document.querySelectorAll('.panel'),function(x){x.classList.toggle('active',x.id===id)});Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('active',x.dataset.tab===id)});if(id==='cadastro')renderPlayers();if(id==='sorteio')renderSelection();if(id==='resultado')renderResult()}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){showTab(t.dataset.tab)})});document.getElementById('novo').onclick=function(){openEdit(null)};document.getElementById('cancelar').onclick=close;document.getElementById('salvar').onclick=function(){var nome=document.getElementById('nome').value.trim();if(!nome){alert('Informe o nome do atleta.');return}var pos=document.getElementById('pos').value,nivel=+document.getElementById('nivel').value;if(editId){var a=atletas.find(function(x){return x.id===editId});a.nome=nome;a.pos=pos;a.nivel=nivel}else{var id='p'+Date.now();atletas.push({id:id,nome:nome,pos:pos,nivel:nivel});sel[id]=true;saveSel()}save();close();renderPlayers();renderSelection()};document.getElementById('excluir').onclick=function(){if(editId&&confirm('Excluir este atleta?')){atletas=atletas.filter(function(a){return a.id!==editId});delete sel[editId];save();saveSel();close();renderPlayers();renderSelection()}};document.getElementById('reset').onclick=function(){if(confirm('Restaurar a lista inicial? Alterações locais serão perdidas.')){atletas=seed.slice();sel={};save();saveSel();renderPlayers()}};document.getElementById('todos').onclick=function(){atletas.forEach(function(a){sel[a.id]=true});saveSel();renderSelection()};document.getElementById('nenhum').onclick=function(){atletas.forEach(function(a){sel[a.id]=false});saveSel();renderSelection()};document.getElementById('gerar').onclick=makePairs;document.getElementById('novamente').onclick=makePairs;document.getElementById('copiar').onclick=function(){var text=textResult();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){alert('Resultado copiado. Agora é só colar no WhatsApp.')},function(){fallback(text)})}else fallback(text)};function fallback(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Resultado copiado. Agora é só colar no WhatsApp.')}catch(e){prompt('Copie o texto abaixo:',text)}document.body.removeChild(ta)}document.getElementById('pdf').onclick=function(){showTab('resultado');setTimeout(function(){window.print()},100)};document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')close()});renderPlayers();renderSelection();renderResult();
})();
</script></body></html>
