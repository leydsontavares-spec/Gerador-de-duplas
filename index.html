<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gerador de Duplas</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dfe4e8;border-radius:16px;padding:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px}.muted{color:#667085;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{appearance:none;border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:700;background:#e9eef3;color:#17202a;min-height:44px}button.primary{background:#1769aa;color:#fff}button:active{transform:scale(.98)}.player{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f2}.player:last-child{border-bottom:0}.player input{width:21px;height:21px}.name{font-weight:700}.meta{font-size:13px;color:#667085;margin-top:3px}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef2f6;white-space:nowrap}.pair{padding:13px;border:1px solid #e1e6ea;border-radius:13px;margin:9px 0}.pair-title{font-size:12px;color:#667085;font-weight:800;text-transform:uppercase;margin-bottom:8px}.versus{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:6px}.person{min-width:0}.person strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{color:#667085}.x{text-align:center;color:#98a2b3;font-weight:800}.alone{background:#fff4e5}.summary{font-size:14px;color:#475467;margin-top:10px}.footer{font-size:12px;color:#98a2b3;text-align:center;padding:6px 0 20px}@media(max-width:420px){body{padding:10px}.card{padding:14px}.versus{grid-template-columns:1fr 20px 1fr}button{flex:1}}
</style></head><body><main class="app"><section class="card"><h1>Gerador de Duplas</h1><div class="muted">Selecione os presentes e gere as duplas. O sorteio busca equilibrar nível e posição e evita dois goleiros juntos.</div><div class="toolbar"><button id="all">Todos</button><button id="none">Limpar</button><button id="generate" class="primary">Gerar duplas</button></div><div id="counter" class="summary"></div></section><section class="card"><h2>Atletas</h2><div id="players"></div></section><section class="card"><h2>Resultado</h2><div id="message" class="muted">Nenhum sorteio realizado.</div><div id="results"></div><div class="toolbar"><button id="again" class="primary">Sortear novamente</button></div></section><div class="footer">Arquivo independente • não precisa de internet ou banco de dados</div></main><script>
(function(){
var athletes=[
['Leydson','Ataque',5],['Julio','Meio',5],['Ruviery Diego','Defesa',5],['Thiaguinho','Meio',5],['Edson Oliveira','Meio',5],['Daniel','Meio',5],['Eudes Demetrio','Defesa',4],['Paulo','Defesa',5],['Gabriel JVT','Goleiro',5],['Arthur Martins','Ataque',5],['Arioston Ramalho','Ataque',4],['Luis Vaqueiro Novo','Goleiro',4],['Henrique Moura','Meio',5],['Jheymisson','Defesa',3],['Gabriel','Meio',4],['Everton Soteldo','Meio',5],['Ricardo Dutra','Meio',5],['Japa Racha','Goleiro',4],['Pablo','Defesa',5],['Jocienio','Defesa',4],['Bruno Personal','Meio',4],['Guga Moura','Defesa',4],['Nilson Cunha','Ataque',4],['Jefferson','Defesa',3],['Samuel Curota','Defesa',4],['Matheus','Defesa',2],['Toninho','Meio',5],['Rodolfo Almeida','Defesa',4],['Duarte','Defesa',5],['Bruno Viana','Ataque',5]
];
var players=athletes.map(function(a,i){return{id:i,name:a[0],pos:a[1],level:a[2],selected:true};});
var elPlayers=document.getElementById('players'),counter=document.getElementById('counter'),results=document.getElementById('results'),message=document.getElementById('message');
function stars(n){var s='';for(var i=0;i<n;i++)s+='★';return s;}
function render(){elPlayers.innerHTML='';players.forEach(function(p){var row=document.createElement('label');row.className='player';var cb=document.createElement('input');cb.type='checkbox';cb.checked=p.selected;cb.addEventListener('change',function(){p.selected=cb.checked;updateCounter();});var txt=document.createElement('div');txt.innerHTML='<div class="name"></div><div class="meta"></div>';txt.children[0].textContent=p.name;txt.children[1].textContent=p.pos+' • '+stars(p.level);var b=document.createElement('span');b.className='badge';b.textContent=p.level+'/5';row.appendChild(cb);row.appendChild(txt);row.appendChild(b);elPlayers.appendChild(row);});updateCounter();}
function updateCounter(){var n=players.filter(function(p){return p.selected;}).length;counter.textContent=n+' atleta'+(n===1?'':'s')+' selecionado'+(n===1?'':'s')+'.';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function compatibility(a,b){var penalty=Math.abs(a.level-b.level)*5;if(a.pos===b.pos)penalty+=2;if(a.pos==='Goleiro'&&b.pos==='Goleiro')penalty+=100;var comp={Defesa:{Ataque:-2,Meio:-1},Ataque:{Defesa:-2,Meio:-1},Meio:{Defesa:-1,Ataque:-1},Goleiro:{Defesa:-1,Meio:0,Ataque:0}};if(comp[a.pos]&&typeof comp[a.pos][b.pos]!=='undefined')penalty+=comp[a.pos][b.pos];penalty+=Math.random()*3;return penalty;}
function makePairs(){var pool=shuffle(players.filter(function(p){return p.selected;}).slice());if(pool.length<2){message.textContent='Selecione pelo menos 2 atletas.';results.innerHTML='';return;}var pairs=[];while(pool.length>1){var a=pool.shift(),best=0,bestScore=9999;for(var i=0;i<pool.length;i++){var sc=compatibility(a,pool[i]);if(sc<bestScore){bestScore=sc;best=i;}}pairs.push([a,pool.splice(best,1)[0]]);}results.innerHTML='';pairs.forEach(function(pair,idx){var a=pair[0],b=pair[1],div=document.createElement('div');div.className='pair';div.innerHTML='<div class="pair-title">Dupla '+(idx+1)+'</div><div class="versus"><div class="person"><strong></strong><small></small></div><div class="x">+</div><div class="person"><strong></strong><small></small></div></div>';var persons=div.querySelectorAll('.person');persons[0].querySelector('strong').textContent=a.name;persons[0].querySelector('small').textContent=a.pos+' • '+stars(a.level);persons[1].querySelector('strong').textContent=b.name;persons[1].querySelector('small').textContent=b.pos+' • '+stars(b.level);results.appendChild(div);});if(pool.length){var d=document.createElement('div');d.className='pair alone';d.innerHTML='<div class="pair-title">Sem dupla</div><strong></strong><div class="meta"></div>';d.querySelector('strong').textContent=pool[0].name;d.querySelector('.meta').textContent=pool[0].pos+' • '+stars(pool[0].level);results.appendChild(d);}message.textContent=pairs.length+' dupla'+(pairs.length===1?'':'s')+' gerada'+(pairs.length===1?'':'s')+(pool.length?' e 1 atleta ficou sem dupla.':'.');window.scrollTo(0,document.body.scrollHeight);}
document.getElementById('all').addEventListener('click',function(){players.forEach(function(p){p.selected=true;});render();});document.getElementById('none').addEventListener('click',function(){players.forEach(function(p){p.selected=false;});render();});document.getElementById('generate').addEventListener('click',makePairs);document.getElementById('again').addEventListener('click',makePairs);render();
})();
</script></body></html>
